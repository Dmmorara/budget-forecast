# Runs on every pull request, so each PR carries a visible pass/fail check.
#
# Section 5.5.5 asks for "pull requests, checks, review feedback and merge
# decisions". The check is the part that cannot be asserted in prose: a green
# tick on a PR is evidence the tests actually ran against that change, dated
# and attributable, rather than a claim that they were run locally.
#
# Two codebases, two test jobs (§4.4.8): pytest for the service, flutter
# analyze and flutter test for client/. Each runs only when its side changed.
#
# The filtering is done by the `changes` job and `if:` on each test job, NOT
# by `paths:` on the workflow. Branch protection requires the `pytest` check;
# a workflow that never starts leaves a required check pending forever and
# blocks the merge, whereas a job skipped by `if:` reports as passing.
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.diff.outputs.service }}
      client: ${{ steps.diff.outputs.client }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        name: Decide which side changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No usable base (first push, force-push): run everything.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "service=true" >> "$GITHUB_OUTPUT"
            echo "client=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "$FILES"
          # Anything outside client/ (app/, tests/, the Dockerfile, this
          # workflow) is the service's concern; client/** is the client's.
          echo "service=$(echo "$FILES" | grep -qv '^client/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "client=$(echo "$FILES" | grep -q '^client/' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  pytest:
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Reproduce the measured baseline
        # Fails the build if the baseline script breaks. The numbers in
        # BASELINE.md are only trustworthy for as long as the script that
        # produced them still runs.
        run: python -m scripts.measure_baseline

  flutter:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The version the client was built and tested with locally.
          # client/tool/render_build.sh pins the same one; change both together.
          flutter-version: 3.47.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Widget tests
        run: flutter test

  secrets:
    # Every change, either side: a client-only PR could add client/.env just
    # as easily as a service PR could add .env.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no secrets or data extracts are tracked
        run: |
          # data/public/ is the one allowed exception: a minimised,
          # pseudonymised slice with no names, committed because the deployed
          # service builds from this repository. scripts/minimise_extract.py
          # documents exactly what it contains. Everything else is rejected.
          OFFENDING=$(git ls-files \
            | grep -Ei '(^|/)\.env$|\.(xlsx|xls|csv|pkl|joblib)$' \
            | grep -v '^data/public/' || true)
          if [ -n "$OFFENDING" ]; then
            echo "$OFFENDING"
            echo "::error::a secret or data extract is tracked - see CONTRIBUTING.md"
            exit 1
          fi
          # And the exception must stay minimal: no names may appear in it.
          if grep -rilE 'first_name|last_name|full_name|relationship' data/public/ 2>/dev/null; then
            echo "::error::data/public/ contains personal names - re-run scripts/minimise_extract.py"
            exit 1
          fi
          echo "clean"
